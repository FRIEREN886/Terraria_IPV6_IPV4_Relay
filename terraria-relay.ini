; Terraria IPv6 Relay Server
; 建议执行: chmod 600 /etc/terraria-relay.ini

[server]
listen_address = ::
listen_port = 17777

; Terraria 与中继在同一台 Ubuntu 时使用 ::1
target_host = 127.0.0.1
target_port = 7777

; 请修改为至少 16 位的随机字符串，并与 Windows 客户端保持一致
token = change-this-to-a-long-random-token

max_connections = 64
connect_timeout = 10
handshake_timeout = 10
keepalive = 15
